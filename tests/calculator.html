<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pruebas de la calculadora</title>
</head>
<body>
    <h1>Pruebas de la calculadora</h1>
    <pre id="results" aria-live="polite">Ejecutando...</pre>
    <iframe id="calculator" title="Calculadora de prueba" style="width: 375px; height: 740px; border: 0"></iframe>
    <script>
        const results = [];
        const assert = (condition, message) => { if (!condition) throw new Error(message); };
        const near = (actual, expected) => assert(Math.abs(actual - expected) < 0.000001, `${actual} != ${expected}`);
        const test = async (name, check) => {
            try {
                await check();
                results.push({ name, passed: true });
            } catch (error) {
                results.push({ name, passed: false, error: error.message });
            }
        };
        const frame = document.getElementById('calculator');
        frame.onload = async () => {
            const app = frame.contentWindow;
            const api = app.eval(`({
                INITIAL_STATE, Calculators, SERVICE_PERIODS, SERVICE_COUNTS, ACLES_CERTIFICATES,
                getLimitedMeritState, getServiceCountLimit, getIdiomasBreakdown, completeMonthsBetween,
                renderSection1, renderSection3, renderSection4, renderSection5, renderSection6, renderSummary, renderBreakdown,
                renderServiceLimitSummary, addIdiomaForOrigin, updateIdioma, handleInput,
                renderSeniorityWizardStep, applySeniorityWizard,
                randomizeWavePhases,
                getState: () => state,
                setState: value => { state = value; },
                disableSaving: () => { saveState = () => {}; }
            })`);
            api.disableSaving();
            const fresh = (overrides = {}) => ({ ...structuredClone(api.INITIAL_STATE), ...overrides });
            const parsed = html => {
                const element = app.document.createElement('div');
                element.innerHTML = html;
                return element;
            };
            await test('Bienvenida bloquea el fondo y permite leer la tarjeta en pantallas bajas', () => {
                const root = app.document.documentElement;
                const card = app.document.querySelector('#landing-page > .landing-card');
                assert(app.getComputedStyle(root).overflowY === 'hidden', 'El fondo se desplaza');
                frame.style.height = '400px';
                assert(card.getBoundingClientRect().top >= 0, 'Se corta el inicio de la tarjeta');
                assert(card.getBoundingClientRect().bottom <= app.innerHeight, 'Se corta el final de la tarjeta');
                assert(app.getComputedStyle(card).overflowY === 'auto', 'La tarjeta no permite desplazarse');
                app.closeLanding();
                assert(!root.classList.contains('landing-open'), 'El bloqueo persiste al entrar');
                assert(app.getComputedStyle(root).overflowY !== 'hidden', 'No se restaura el scroll');
                frame.style.height = '740px';
            });
            await test('Estado inicial sin puntos', () => near(api.Calculators.total(fresh()), 0));
            await test('Fase de todas las olas vuelve a aleatorizarse entre cargas', () => {
                api.setState(fresh());
                app.switchTab(1);
                app.switchTab(7);
                const waves = [...app.document.querySelectorAll('.landing-wave, .summary-wave, .credits-wave')];
                assert(waves.length >= 12, `Olas insuficientes: ${waves.length}`);
                const originalRandom = app.Math.random;
                try {
                    app.Math.random = () => 0.1;
                    api.randomizeWavePhases();
                    const firstPhases = waves.map(wave => wave.style.animationDelay);
                    app.Math.random = () => 0.8;
                    api.randomizeWavePhases();
                    const secondPhases = waves.map(wave => wave.style.animationDelay);
                    assert(firstPhases.every((phase, index) => phase !== secondPhases[index]), 'La fase no cambia');
                    assert(waves.every(wave => Number.parseFloat(wave.style.animationDelay) < 0), 'Fase aleatoria no negativa');
                } finally {
                    app.Math.random = originalRandom;
                }
            });
            await test('Aviso de acceso a catedraticos depende de los 8 anos de carrera', () => {
                for (const [serviceYears, careerStartDate, shouldWarn] of [
                    [7, '', true],
                    [8, '', false],
                    [20, '2019-11-26', true],
                    [20, '2018-11-26', false]
                ]) {
                    api.setState(fresh({
                        s2_catedratico: true,
                        s1_2_1_years: serviceYears,
                        seniorityWizard: { status: careerStartDate ? 'definitive' : '', careerStartDate }
                    }));
                    const section2 = parsed(app.renderSection2());
                    const warning = section2.querySelector('#catedraticos-eligibility-warning');
                    assert(warning.classList.contains('hidden') !== shouldWarn, 'Aviso no coincide con los años de carrera');
                    if (shouldWarn) assert(section2.querySelector('#catedraticos-eligibility-warning a').href.includes('/acceso-a-catedras-2026-procedimiento'), 'Falta enlace oficial');
                }
                api.setState(fresh({ s2_catedratico: true, s1_2_1_years: 20, seniorityWizard: { status: 'practice' } }));
                assert(parsed(app.renderSection2()).querySelector('#catedraticos-eligibility-warning'), 'No advierte en prácticas');
            });
            await test('Preguntas de tutoria adaptadas a las fechas y a la condicion de carrera', () => {
                for (const [bodyStartDate, careerStartDate, ask4, ask6] of [
                    ['', '', true, true],
                    ['2007-08-31', '2023-08-31', true, true],
                    ['2007-09-01', '2023-09-01', false, false],
                    ['2020-09-01', '2024-09-01', false, false]
                ]) {
                    api.setState(fresh({ seniorityWizard: { status: 'provisional', bodyStartDate, careerStartDate } }));
                    const section4 = parsed(api.renderSection4());
                    const section6 = parsed(api.renderSection6());
                    assert(!!section4.querySelector('[aria-label="Funciones de tutoría anteriores al 1 de septiembre de 2007"]') === ask4, 'Pregunta 2007 incorrecta');
                    assert(!!section6.querySelector('[aria-label="Tutorización de funcionario/a en prácticas antes del curso 2023/24"]') === ask6, 'Pregunta 2023 incorrecta');
                    assert(section4.querySelector('[name="s4_3_tutoria_years"]').disabled === ask4, 'Campo 4.3 incorrecto');
                    assert(section6.querySelector('[name="s6_6_tutor_aspirantes"]').disabled === ask6, 'Campo 6.6 incorrecto');
                }
                const s = fresh({ s1_2_1_years: 20, s6_6_tutor_aspirantes: 3, seniorityWizard: { status: 'practice' } });
                api.setState(s);
                assert(parsed(api.renderSection6()).querySelector('[name="s6_6_tutor_aspirantes"]').disabled, 'En practicas puede tutorizar');
                near(api.Calculators.calc66(s), 0);
                s.seniorityWizard = { status: 'provisional', careerStartDate: '2025-09-01' };
                near(api.Calculators.calc66(s), 0.2);
            });
            await test('EOI no selecciona B1 ni puntua sin elegir nivel', () => {
                api.setState(fresh({ lang33Mode: 'eoi' }));
                app.switchTab(3);
                api.addIdiomaForOrigin('EOI');
                assert(api.getState().idiomas[0].nivel === '', 'Nivel inicial no vacio');
                api.updateIdioma(0, 'idioma', 'Inglés');
                const select = app.document.querySelector('[aria-label="Nivel del certificado EOI"]');
                assert(select.value === '', 'Selector con nivel preseleccionado');
                near(api.Calculators.calc33(api.getState()), 0);
                api.updateIdioma(0, 'nivel', 'C1');
                near(api.Calculators.calc33(api.getState()), 3);
                api.updateIdioma(0, 'nivel', '');
                near(api.Calculators.calc33(api.getState()), 0);
            });
            await test('Conserva niveles EOI guardados y mayor nivel por idioma', () => {
                const s = fresh({ idiomas: [
                    { idioma: 'Inglés', nivel: 'B1', origen: 'EOI' },
                    { idioma: 'Inglés', nivel: 'C2', origen: 'EOI' },
                    { idioma: 'Francés', nivel: '', origen: 'EOI' }
                ] });
                near(api.Calculators.calc33(s), 4);
            });
            await test('ACLES sigue requiriendo un certificado reconocido', () => {
                const [certificado, nivel] = api.ACLES_CERTIFICATES.Inglés.find(([, level]) => level === 'B2');
                const s = fresh({ idiomas: [{ idioma: 'Inglés', nivel, certificado, origen: 'ACLES' }] });
                near(api.Calculators.calc55(s), 2);
                s.idiomas[0].certificado = '';
                near(api.Calculators.calc55(s), 0);
            });
            await test('Letras solo en desglose, no en formularios de 3.3 y 5.4', () => {
                api.setState(fresh({
                    lang33Mode: 'eoi', s5_4_competencia_digital: 'C2',
                    idiomas: [{ idioma: 'Inglés', nivel: 'B1', origen: 'EOI' }]
                }));
                assert(!/3\.3 [a-g]\)/.test(api.renderSection3()), 'Letras visibles en 3.3');
                assert(!/5\.4 [a-f]\)/.test(api.renderSection5()), 'Letras visibles en 5.4');
                assert(api.renderBreakdown().includes('3.3 d)'), 'Falta letra EOI en desglose');
                assert(api.renderBreakdown().includes('5.4 f)'), 'Falta letra CDD en desglose');
            });
            await test('Todos los periodos del 4 dependen solo de 1.2.1', () => {
                const s = fresh({ s1_2_1_years: 2, s1_2_1_months: 2, s1_2_2_years: 99 });
                Object.keys(api.SERVICE_PERIODS).filter(p => p.startsWith('s4_')).forEach(p => { s[`${p}_years`] = 9; });
                const limited = api.getLimitedMeritState(s);
                Object.keys(api.SERVICE_PERIODS).filter(p => p.startsWith('s4_')).forEach(p => {
                    assert(limited[`${p}_years`] === 2 && limited[`${p}_months`] === 2, `Limite incorrecto: ${p}`);
                });
                near(api.Calculators.calc41(s), 9.75);
                near(api.Calculators.calc42(s), 6.5);
                near(api.Calculators.calc43(s), 9.75);
                s.s1_2_2_years = 0;
                near(api.Calculators.calc41(s), 9.75);
                assert(s.s4_1_director_years === 9, 'Se borraron los datos introducidos');
            });
            await test('6.2, 6.5 y 6.6 usan anos completos y mantienen topes', () => {
                const s = fresh({ s1_2_1_years: 2, s1_2_1_months: 11 });
                Object.keys(api.SERVICE_COUNTS).forEach(name => { s[name] = 9; });
                const limited = api.getLimitedMeritState(s);
                Object.keys(api.SERVICE_COUNTS).forEach(name => assert(limited[name] === 2, name));
                near(api.Calculators.calc62(s), 2.5);
                near(api.Calculators.calc65(s), 1);
                near(api.Calculators.calc66(s), 0.6);
                s.s1_2_1_years = 10;
                assert(api.getServiceCountLimit(s, 's6_6_tutor_aspirantes') === 3, 'Supera 3 cursos');
            });
            await test('Sin servicios de 1.2.1 no se computan periodos o cursos dependientes', () => {
                const s = fresh({ s1_2_2_years: 99 });
                Object.keys(api.SERVICE_PERIODS).forEach(p => { s[`${p}_years`] = 9; });
                Object.keys(api.SERVICE_COUNTS).forEach(name => { s[name] = 9; });
                near(api.Calculators.calc11(s), 0);
                near(api.Calculators.section4(s), 0);
                near(api.Calculators.calc62(s), 0);
                near(api.Calculators.calc65(s), 0);
                near(api.Calculators.calc66(s), 0);
            });
            await test('Meses sueltos no completan un ano y se mantiene el tope de tutoria de 2007', () => {
                const s = fresh({ s1_2_1_months: 11, s6_6_tutor_master_grado: 1 });
                near(api.Calculators.calc66(s), 0);
                s.s1_2_1_years = 1;
                near(api.Calculators.calc66(s), 0.1);
                s.s1_2_1_years = 40;
                s.s4_3_tutoria_years = 30;
                const limited = api.getLimitedMeritState(s);
                assert(limited.s4_3_tutoria_years === 19 && limited.s4_3_tutoria_months === 2, 'No conserva el tope de 2007');
            });
            await test('No limita premios o proyectos de investigacion por antiguedad', () => {
                const s = fresh({ s6_2_intl_1: 1, s6_2_investigacion_projects: 2 });
                near(api.Calculators.calc62(s), 1.9);
            });
            await test('Formulario 6.2.a agrupa premios e investigacion y 6.2.b agrupa planes educativos', () => {
                api.setState(fresh({ s6_2_investigacion_projects: 2 }));
                const section = parsed(api.renderSection6());
                const headings = [...section.querySelectorAll('h4')];
                const groupA = headings.find(heading => heading.textContent.startsWith('6.2.a '))?.parentElement;
                const groupB = headings.find(heading => heading.textContent.startsWith('6.2.b '))?.parentElement;
                assert(groupA && groupB, 'Faltan los dos subapartados oficiales');
                const research = groupA.querySelector('[name="s6_2_investigacion_projects"]');
                assert(research && research.value === '2', 'No muestra la participacion en investigacion guardada');
                assert(!research.disabled && !groupB.contains(research), 'La investigacion no corresponde al 6.2.a');
                assert(groupA.querySelector('[name="s6_2_intl_1"]'), 'Premios fuera del 6.2.a');
                for (const name of ['s6_2_coord_plan_igualdad_years', 's6_2_coord_proyectos_years', 's6_2_part_proyectos_years']) {
                    assert(groupB.querySelector(`[name="${name}"]`), `${name} fuera del 6.2.b`);
                }
            });
            await test('Investigacion en 6.2.a actualiza la puntuacion y aparece en el desglose y PDF', () => {
                api.setState(fresh());
                app.switchTab(6);
                const input = app.document.querySelector('[name="s6_2_investigacion_projects"]');
                input.value = '2';
                api.handleInput(input);
                near(api.Calculators.calc62(api.getState()), 0.4);
                assert(app.document.getElementById('score-s62').textContent.includes('0,4000'), 'Puntuacion de 6.2 desactualizada');
                const breakdown = parsed(api.renderBreakdown()).textContent;
                assert(breakdown.includes('6.2.a Participación en proyectos de investigación o innovación educativa (2 proyectos)'), 'Falta la investigacion en el desglose');
                assert(breakdown.includes('0,4000'), 'Valor incorrecto en el desglose');
                assert(parsed(api.renderSummary()).textContent.includes('6.2.a Participación en proyectos de investigación o innovación educativa (2 proyectos)'), 'Falta la investigacion en el informe imprimible');
            });
            await test('6.2.a y 6.2.b comparten el tope sin cambiar las puntuaciones existentes', () => {
                const s = fresh({
                    s1_2_1_years: 5, s6_2_auto_1: 1, s6_2_investigacion_projects: 2,
                    s6_2_coord_proyectos_years: 1, s6_2_part_proyectos_years: 2
                });
                near(api.Calculators.calc62(s), 1.8);
                api.setState(s);
                const breakdown = parsed(api.renderBreakdown()).textContent;
                for (const label of ['6.2.a Premio', '6.2.b Coordinación de otros proyectos', '6.2.b Participación en proyectos']) {
                    assert(breakdown.includes(label), `Falta ${label}`);
                }
                s.s6_2_coord_plan_igualdad_years = 1;
                near(api.Calculators.calc62(s), 2.5);
                s.s6_2_investigacion_projects = 20;
                near(api.Calculators.calc62(s), 2.5);
                assert(s.s6_2_investigacion_projects === 20, 'Borra los meritos al alcanzar el tope');
            });
            await test('1.1 excluye practicas e interinidad cuando se conoce el nombramiento', () => {
                const s = fresh({
                    s1_2_1_years: 20, s1_1_1_years: 20, s1_1_2_years: 20, s1_1_3_years: 20,
                    seniorityWizard: { status: 'definitive', careerStartDate: '2025-09-01' }
                });
                const limited = api.getLimitedMeritState(s);
                assert(limited.s1_1_1_years === 1 && limited.s1_1_1_months === 2, 'Incluye servicios anteriores a carrera');
                assert(limited.s1_1_2_years === 0, 'Computa provisionalidad sin confirmar el supuesto del primer destino');
                assert(limited.s1_1_3_years === 1 && limited.s1_1_3_months === 2, 'Compensatoria supera carrera');
            });
            await test('Primer definitivo voluntario suma provisionalidad anterior en calculo y desglose', () => {
                const s = fresh({
                    s1_2_1_years: 3, s1_2_1_months: 2,
                    s1_1_1_years: 1, s1_1_1_months: 2,
                    s1_1_2_years: 1, s1_1_3_years: 3,
                    seniorityWizard: {
                        status: 'definitive', firstDefinitiveParticipation: 'yes',
                        careerStartDate: '2024-09-01', definitiveStartDate: '2025-09-01'
                    }
                });
                const limited = api.getLimitedMeritState(s);
                assert(limited.s1_1_2_years === 1 && limited.s1_1_2_months === 0, 'No computa el año provisional anterior');
                assert(limited.s1_1_3_years === 1 && limited.s1_1_3_months === 2, 'Recupera especial dificultad anterior al definitivo');
                s.s1_1_3_years = 0;
                near(api.Calculators.calc11(s), 8.6666);
                api.setState(s);
                const breakdown = parsed(api.renderBreakdown()).textContent;
                assert(breakdown.includes('Provisionalidad anterior al primer destino definitivo (1 año y 0 meses)'), 'No identifica el periodo historico en el informe');
                assert(breakdown.includes('4,0000'), 'No muestra los cuatro puntos historicos');
                assert(!parsed(api.renderSection1()).querySelector('[name="s1_1_2_years"]').disabled, 'El periodo historico sigue deshabilitado');
            });
            await test('Provisionalidad anterior limitada por fechas y no por un maximo de dos años', () => {
                const s = fresh({
                    s1_2_1_years: 10, s1_1_1_years: 2, s1_1_1_months: 2, s1_1_2_years: 9,
                    seniorityWizard: {
                        status: 'definitive', firstDefinitiveParticipation: 'yes',
                        careerStartDate: '2020-09-01', definitiveStartDate: '2024-09-01'
                    }
                });
                const limited = api.getLimitedMeritState(s);
                assert(limited.s1_1_2_years === 4 && limited.s1_1_2_months === 0, 'No respeta los cuatro años anteriores');
                assert(s.s1_1_2_years === 9, 'Borra el exceso introducido');
                near(api.completeMonthsBetween('2024-09-15', '2025-09-01'), 11);
                near(api.completeMonthsBetween('2024-09-01', '2025-09-01'), 12);
                assert(api.completeMonthsBetween('2025-09-01', '2024-09-01') === null, 'Acepta un intervalo invertido');
                api.setState(s);
                const notice = parsed(api.renderSection1()).querySelector('[data-service-period="s1_1_2"]');
                assert(!notice.classList.contains('hidden') && notice.textContent.includes('4 años y 0 meses'), 'Falta el aviso del limite historico');
            });
            await test('Sin fechas, la provisionalidad anterior no duplica los meses de 1.1.1', () => {
                const s = fresh({
                    s1_2_1_years: 4, s1_1_1_years: 2, s1_1_2_years: 3,
                    seniorityWizard: { status: 'definitive', firstDefinitiveParticipation: 'yes' }
                });
                const limited = api.getLimitedMeritState(s);
                assert(limited.s1_1_2_years === 2, 'Duplica tiempo definitivo y provisional');
                near(api.Calculators.calc11(s), 16);
                assert(JSON.stringify(api.getLimitedMeritState(limited)) === JSON.stringify(limited), 'La limitacion cambia al aplicarla otra vez');
            });
            await test('Confirmacion manual del primer definitivo habilita 1.1.2 sin borrar las cifras', () => {
                api.setState(fresh({
                    s1_2_1_years: 4, s1_1_1_years: 2, s1_1_2_years: 1,
                    seniorityWizard: { status: 'definitive', firstDefinitiveParticipation: '' }
                }));
                app.switchTab(1);
                for (const answer of ['yes', 'no', '', 'yes']) {
                    const select = app.document.getElementById('first-definitive-participation');
                    select.value = answer;
                    select.dispatchEvent(new app.Event('change', { bubbles: true }));
                    const input = app.document.querySelector('[name="s1_1_2_years"]');
                    assert(input.disabled === (answer !== 'yes'), 'Estado incorrecto del campo historico');
                    assert(api.getState().s1_1_2_years === 1, 'Borra la cifra al cambiar la confirmacion');
                    near(api.Calculators.calc11(api.getState()), answer === 'yes' ? 12 : 8);
                }
                app.openSeniorityWizard();
                assert(app.document.getElementById('wizard-first-definitive').value === 'yes', 'Cuestionario no recupera confirmacion manual');
                assert(app.document.getElementById('wizard-provisional-years').value === '1', 'Cuestionario no recupera duracion manual');
                app.closeSeniorityWizard();
            });
            await test('Cuestionario recoge y recupera la provisionalidad anterior al primer definitivo', () => {
                api.setState(fresh());
                app.openSeniorityWizard();
                app.document.getElementById('wizard-status').value = 'definitive';
                app.setWizardDateValue('wizard-definitive-start', '2025-09-01');
                app.setWizardDateValue('wizard-practice-start', '2023-09-01');
                app.setWizardDateValue('wizard-career-start', '2024-09-01');
                app.setWizardDateValue('wizard-body-start', '2023-09-01');
                const steps = app.getSeniorityWizardSteps();
                const history = steps.find(step => step.querySelector('#wizard-first-definitive'));
                assert(history && app.validateSeniorityWizardStep(history), 'Permite omitir la confirmacion del supuesto');
                app.document.getElementById('wizard-first-definitive').value = 'yes';
                app.toggleWizardProvisionalHistory();
                assert(!app.document.getElementById('wizard-provisional-years').disabled, 'No habilita años historicos');
                app.document.getElementById('wizard-provisional-years').value = '1';
                app.document.getElementById('wizard-provisional-months').value = '0';
                assert(!app.validateSeniorityWizardStep(history), 'Rechaza respuestas validas');
                app.applySeniorityWizard();
                const s = api.getState();
                assert(s.seniorityWizard.firstDefinitiveParticipation === 'yes', 'No guarda la confirmacion');
                assert(s.s1_1_1_years === 1 && s.s1_1_1_months === 2, 'Altera la permanencia definitiva');
                assert(s.s1_1_2_years === 1 && s.s1_1_2_months === 0, 'No guarda el periodo historico');
                near(api.Calculators.calc11(s), 8.6666);
                app.openSeniorityWizard();
                assert(app.document.getElementById('wizard-first-definitive').value === 'yes', 'No recupera la confirmacion');
                assert(app.document.getElementById('wizard-provisional-years').value === '1', 'No recupera los años');
                app.document.getElementById('wizard-status').value = 'provisional';
                assert(!app.getSeniorityWizardSteps().some(step => step.querySelector('#wizard-first-definitive')), 'Pregunta historica aparece estando provisional');
                app.applySeniorityWizard();
                assert(api.getState().s1_1_2_years === 2 && api.getState().s1_1_2_months === 2, 'No mantiene el calculo de la provisionalidad actual');
                assert(api.getState().seniorityWizard.firstDefinitiveParticipation === '', 'Mantiene una confirmacion que ya no corresponde');
                app.closeSeniorityWizard();
            });
            await test('Pregunta de provisionalidad anterior actualiza la fecha de carrera al volver al paso', () => {
                api.setState(fresh());
                app.openSeniorityWizard();
                app.document.getElementById('wizard-status').value = 'definitive';
                app.document.getElementById('wizard-first-definitive').value = 'yes';
                app.toggleWizardProvisionalHistory();
                const dialog = app.document.getElementById('seniority-wizard');
                const historyIndex = app.getSeniorityWizardSteps().findIndex(step => step.querySelector('#wizard-first-definitive'));
                for (const [date, expected] of [
                    ['2024-09-01', 'el 01/09/2024'],
                    ['2022-10-15', 'el 15/10/2022'],
                    ['', 'tu nombramiento']
                ]) {
                    dialog.dataset.stepIndex = String(historyIndex - 1);
                    api.renderSeniorityWizardStep();
                    app.setWizardDateValue('wizard-career-start', date);
                    dialog.dataset.stepIndex = String(historyIndex);
                    api.renderSeniorityWizardStep();

                    { key: 'Enter', metaKey: true }, { key: 'Enter', shiftKey: true }

                try {
                    const target = app.document.elementFromPoint(bounds.left + bounds.width / 2, bounds.top + bounds.height / 2);
