<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pruebas de la calculadora</title>
</head>
<body>
    <h1>Pruebas de la calculadora</h1>
    <pre id="results" aria-live="polite">Ejecutando...</pre>
    <iframe id="calculator" title="Calculadora de prueba" style="width: 375px; height: 740px; border: 0"></iframe>
    <script>
        const results = [];
        const assert = (condition, message) => { if (!condition) throw new Error(message); };
        const near = (actual, expected) => assert(Math.abs(actual - expected) < 0.000001, `${actual} != ${expected}`);
        const test = async (name, check) => {
            try {
                await check();
                results.push({ name, passed: true });
            } catch (error) {
                results.push({ name, passed: false, error: error.message });
            }
        };
        const frame = document.getElementById('calculator');
        frame.onload = async () => {
            const app = frame.contentWindow;
            const api = app.eval(`({
                INITIAL_STATE, Calculators, SERVICE_PERIODS, SERVICE_COUNTS, ACLES_CERTIFICATES,
                getLimitedMeritState, getServiceCountLimit, getIdiomasBreakdown, completeMonthsBetween,
                renderSection1, renderSection3, renderSection4, renderSection5, renderSection6, renderSummary, renderBreakdown,
                renderServiceLimitSummary, addIdiomaForOrigin, updateIdioma, handleInput,
                renderSeniorityWizardStep, applySeniorityWizard,
                randomizeWavePhases,
                getBilingualResult, setBilingualAnswer, loadState,
                getState: () => state,
                setState: value => { state = value; },
                disableSaving: () => { saveState = () => {}; }
            })`);
            api.disableSaving();
            const fresh = (overrides = {}) => ({ ...structuredClone(api.INITIAL_STATE), ...overrides });
            const parsed = html => {
                const element = app.document.createElement('div');
                element.innerHTML = html;
                return element;
            };
            await test('Creditos enlazan Cuevas Bajas y los cuatro emojis en bienvenida y pie', () => {
                for (const context of ['landing', 1, 7]) {
                    if (context !== 'landing') app.switchTab(context);
                    const container = context === 'landing'
                        ? app.document.querySelector('#landing-page')
                        : app.document.querySelector('.credits-wave-credit');
                    const links = [...container.querySelectorAll('a[href="https://youtu.be/dGbyNi_Z25c"]')];
                    assert(links.length === 2, `Enlaces incorrectos en ${context}`);
                    assert(links[0].textContent.trim() === 'Cuevas Bajas (Málaga)', 'Falta el enlace de Cuevas Bajas');
                    assert(links[1].textContent.trim() === '🥕 💜 🫒 🏞️', 'Falta el enlace de los emojis');
                    assert(links[1].getAttribute('aria-label').includes('Cuevas Bajas'), 'Enlace de emojis sin nombre accesible');
                    for (const link of links) {
                        assert(link.target === '_blank' && link.rel.includes('noopener') && link.rel.includes('noreferrer'), 'Enlace externo inseguro');
                        assert(link.classList.contains('whitespace-nowrap'), 'El contenido del enlace puede dividirse');
                        assert(link.querySelector('svg[aria-hidden="true"]'), 'Falta el icono de enlace externo');
                    }
                }
            });
            await test('Bienvenida bloquea el fondo y permite leer la tarjeta en pantallas bajas', () => {
                const root = app.document.documentElement;
                const card = app.document.querySelector('#landing-page > .landing-card');
                assert(app.getComputedStyle(root).overflowY === 'hidden', 'El fondo se desplaza');
                assert(app.getComputedStyle(root).scrollbarWidth === 'none', 'La raiz muestra la barra durante la bienvenida');
                assert(app.getComputedStyle(app.document.body).scrollbarWidth === 'none', 'El cuerpo muestra la barra durante la bienvenida');
                assert(app.getComputedStyle(root, '::-webkit-scrollbar').width === '0px', 'La barra inicial conserva ancho en Chromium');
                frame.style.height = '400px';
                assert(card.getBoundingClientRect().top >= 0, 'Se corta el inicio de la tarjeta');
                assert(card.getBoundingClientRect().bottom <= app.innerHeight, 'Se corta el final de la tarjeta');
                assert(app.getComputedStyle(card).overflowY === 'auto', 'La tarjeta no permite desplazarse');
                assert(app.getComputedStyle(card).scrollbarWidth === 'none', 'La bienvenida muestra la barra de desplazamiento');
                assert(app.getComputedStyle(card, '::-webkit-scrollbar').display === 'none', 'La barra no se oculta en WebKit');
                card.scrollTop = card.scrollHeight;
                assert(card.scrollTop > 0, 'Ocultar la barra impide leer el final de la bienvenida');
                card.scrollTop = 0;
                app.closeLanding();
                assert(!root.classList.contains('landing-open'), 'El bloqueo persiste al entrar');
                assert(app.getComputedStyle(root).overflowY !== 'hidden', 'No se restaura el scroll');
                assert(app.getComputedStyle(root).scrollbarWidth !== 'none', 'La barra de la calculadora sigue oculta tras entrar');
                frame.style.height = '740px';
            });
            await test('Estado inicial sin puntos', () => near(api.Calculators.total(fresh()), 0));
            await test('Bilingues: EOI y certificados concretos, nunca nivel ACLES generico', () => {
                const bilingual = { ...api.INITIAL_STATE.bilingual, enabled: true, specialty: '590001', language: 'Inglés' };
                for (const [merit, expected] of [
                    [{ idioma: 'Inglés', origen: 'EOI', nivel: 'B2' }, 'yes'],
                    [{ idioma: 'Inglés', origen: 'EOI', nivel: 'B1' }, 'pending'],
                    [{ idioma: 'Francés', origen: 'EOI', nivel: 'C2' }, 'pending'],
                    [{ idioma: 'Inglés', origen: 'ACLES', nivel: 'B2', certificado: 'CertAcles B2' }, 'pending'],
                    [{ idioma: 'Inglés', origen: 'ACLES', nivel: 'B2', certificado: 'Cambridge First Certificate in English (FCE)' }, 'yes'],
                    [{ idioma: 'Inglés', origen: 'ACLES', nivel: 'C2', certificado: 'Cambridge First Certificate in English (FCE)' }, 'pending'],
                    [{ idioma: 'Inglés', origen: 'ACLES', nivel: 'B2', certificado: 'LanguageCert International ESOL Communicator (B2)' }, 'pending']
                ]) {
                    assert(api.getBilingualResult(fresh({ bilingual, idiomas: [merit] })).status === expected, `Resultado incorrecto para ${JSON.stringify(merit)}`);
                }
                assert(api.getBilingualResult(fresh({ bilingual: { ...bilingual, certificate: 'none' } })).status === 'no', 'Sin acreditacion debe explicar el no');
            });
            await test('Bilingues: especialidad, idioma y situacion de practicas', () => {
                for (const [specialty, language, expected] of [
                    ['590061', 'Francés', 'no'], ['590061', 'Inglés', 'yes'],
                    ['597038', 'Alemán', 'yes'], ['598002', 'Alemán', 'no'],
                    ['590001', '', 'pending'], ['', 'Inglés', 'pending'], ['other', 'Inglés', 'no']
                ]) {
                    const bilingual = { enabled: true, specialty, language, certificate: 'eoi-B2' };
                    assert(api.getBilingualResult(fresh({ bilingual })).status === expected, `${specialty}/${language} incorrecto`);
                }
                assert(api.getBilingualResult(fresh({
                    bilingual: { enabled: true, specialty: '590001', language: 'Inglés', certificate: 'fce' },
                    seniorityWizard: { status: 'practice' }
                })).status === 'no', 'No debe dar un si en practicas');
            });
            await test('Bilingues: fechas antiguas y requisitos de las certificaciones', () => {
                const base = { enabled: true, specialty: '590001', language: 'Inglés' };
                for (const [certificate, issuedDate, expected] of [
                    ['aptis-old-b2', '', 'pending'], ['aptis-old-b2', '2024-08-31', 'yes'],
                    ['aptis-old-b2', '2024-09-01', 'no'], ['aptis-old-c1', '2024-02-30', 'pending'],
                    ['pearson-old-b2', '2023-03-31', 'yes'], ['pearson-old-c1', '2023-04-01', 'no']
                ]) {
                    assert(api.getBilingualResult(fresh({ bilingual: { ...base, certificate, issuedDate } })).status === expected, `Fecha ${certificate}/${issuedDate}`);
                }
                for (const certificate of ['aptis-esol-b2', 'languagecert-communicator', 'toeic-c1', 'degree']) {
                    assert(api.getBilingualResult(fresh({ bilingual: { ...base, certificate } })).status === 'pending', `Falta confirmar ${certificate}`);
                    const s = fresh({ bilingual: { ...base, certificate, conditionsConfirmed: true } });
                    assert(api.getBilingualResult(s).status === 'yes', `No admite ${certificate}`);
                    near(api.Calculators.total(s), 0);
                }
            });
            await test('Bilingues: cajas sincronizadas, resultado en resumen y actualizacion de EOI', () => {
                api.setState(fresh());
                app.switchTab(3);
                assert(!app.document.querySelector('[data-bilingual-result]'), 'Resultado sin activar');
                api.setBilingualAnswer('enabled', true);
                api.setBilingualAnswer('specialty', '590001');
                api.setBilingualAnswer('language', 'Inglés');
                api.addIdiomaForOrigin('EOI');
                api.updateIdioma(0, 'idioma', 'Inglés');
                api.updateIdioma(0, 'nivel', 'B2');
                assert(app.document.querySelector('[data-bilingual-result="yes"]'), 'El nivel EOI no actualiza el resultado');
                app.switchTab(5);
                assert(app.document.querySelector('#bilingual-enabled').checked, '5.5 no comparte la casilla');
                assert(app.document.querySelector('#bilingual-specialty').value === '590001', '5.5 no comparte la especialidad');
                assert(parsed(api.renderSummary()).querySelector('[data-bilingual-result="yes"]'), 'Falta el resultado final');
                api.updateIdioma(0, 'nivel', 'B1');
                assert(app.document.querySelector('[data-bilingual-result="pending"]'), 'Resultado obsoleto al bajar el nivel');
                api.setBilingualAnswer('certificate', 'aptis-esol-b2');
                api.setBilingualAnswer('conditionsConfirmed', true);
                assert(app.document.querySelector('[data-bilingual-result="yes"]'), 'Aptis confirmado no habilita');
                api.setBilingualAnswer('language', 'Francés');
                assert(!api.getState().bilingual.conditionsConfirmed && !api.getState().bilingual.certificate, 'Reutiliza acreditacion de otro idioma');
                api.setBilingualAnswer('enabled', false);
                assert(!parsed(api.renderSummary()).querySelector('[data-bilingual-result]'), 'Resultado persiste al desactivar');
            });
            await test('Bilingues: indicacion de presentacion enlazada con el titulo elegido', () => {
                for (const [certificate, label] of [['fce', 'First Certificate in English'], ['cae', 'Certificate in Advanced English']]) {
                    api.setState(fresh({ bilingual: { enabled: true, specialty: '590001', language: 'Inglés', certificate } }));
                    for (const render of [api.renderSection3, api.renderSection5]) {
                        const result = parsed(render()).querySelector('[data-bilingual-result="yes"]');
                        const link = result.querySelector('a[href="https://educaweb.juntadeandalucia.es/public/?x=FA9EDDF6"]');
                        assert(link && link.textContent === 'finalices tu instancia', 'Falta enlace de presentacion');
                        assert(link.target === '_blank' && link.rel.includes('noopener') && link.rel.includes('noreferrer'), 'Enlace externo inseguro');
                        assert(link.querySelector('svg[aria-hidden="true"]'), 'Falta flecha de enlace externo');
                        assert(result.querySelector('strong').textContent.includes(label), 'No utiliza el titulo seleccionado');
                        assert(result.textContent.includes('aún no consta tu acreditación'), 'Falta condicion de acreditacion registrada');
                        assert(!result.textContent.includes('Esto no garantiza'), 'Mantiene el texto sustituido');
                    }
                    const summary = parsed(api.renderSummary()).querySelector('[data-bilingual-result="yes"]');
                    assert(summary.textContent.includes(`puestos bilingües de inglés gracias al título o certificado de Cambridge English — ${label}`), 'Resumen sin idioma o certificado dinamico');
                    assert(!summary.textContent.includes('finalices tu instancia'), 'Resumen repite instrucciones de presentacion');
                    assert(summary.textContent.includes('Comprobación orientativa'), 'Resumen pierde aviso orientativo');
                }
            });
            await test('Bilingues: los meritos preseleccionan idioma y acortan las preguntas', () => {
                api.setState(fresh({ idiomas: [{ idioma: 'Inglés', origen: 'EOI', nivel: 'B2' }] }));
                app.switchTab(3);
                api.setBilingualAnswer('enabled', true);
                api.setBilingualAnswer('specialty', '590001');
                assert(api.getState().bilingual.language === 'Inglés', 'No detecta el idioma EOI');
                assert(api.getState().bilingual.certificate === 'eoi-B2', 'No detecta el nivel EOI');
                assert(!app.document.querySelector('#bilingual-level'), 'Pregunta otra vez el nivel EOI');
                api.updateIdioma(0, 'nivel', 'C1');
                assert(api.getState().bilingual.certificate === 'eoi-C1', 'No actualiza al subir el nivel');
                api.updateIdioma(0, 'nivel', 'B1');
                assert(api.getBilingualResult(api.getState()).status === 'pending', 'Mantiene una habilitacion eliminada');
                assert(app.document.querySelector('#bilingual-level'), 'No permite indicar otra acreditacion');

                api.setState(fresh({ idiomas: [{ idioma: 'Inglés', origen: 'ACLES', nivel: 'B2', certificado: 'CertAcles B2' }] }));
                api.setBilingualAnswer('enabled', true);
                assert(!api.getState().bilingual.language, 'Acepta un certificado ACLES sin correspondencia bilingue');
                const fce = api.ACLES_CERTIFICATES.Inglés.findIndex(([name]) => name === 'Cambridge First Certificate in English (FCE)');
                api.updateIdioma(0, 'certificado', String(fce));
                assert(api.getState().bilingual.language === 'Inglés' && api.getState().bilingual.certificate === 'fce', 'No detecta el certificado ACLES exacto');
                assert(api.getState().idiomas.length === 1, 'Duplica un merito introducido');
                app.removeIdioma(0);
                assert(!api.getState().bilingual.certificate, 'Mantiene el certificado eliminado en 5.5');

                api.setState(fresh({ idiomas: [
                    { idioma: 'Inglés', origen: 'EOI', nivel: 'B2' },
                    { idioma: 'Francés', origen: 'EOI', nivel: 'C1' }
                ] }));
                api.setBilingualAnswer('enabled', true);
                assert(!api.getState().bilingual.language, 'Elige arbitrariamente entre varios idiomas');
                api.setBilingualAnswer('language', 'Francés');
                api.updateIdioma(0, 'nivel', 'C2');
                assert(api.getState().bilingual.language === 'Francés', 'Cambia el idioma elegido al editar otro');
            });
            await test('Bilingues: autocompleta EOI sin sobrescribir filas manuales', () => {
                const manual = { idioma: 'Francés', origen: 'EOI', nivel: 'B2' };
                api.setState(fresh({
                    idiomas: [manual],
                    bilingual: { enabled: true, specialty: '590001', language: 'Inglés' }
                }));
                app.switchTab(5);
                api.setBilingualAnswer('certificate', 'eoi-B2');
                let s = api.getState();
                assert(s.idiomas.length === 2 && s.idiomas[0] === manual, 'Modifica un merito manual');
                assert(s.lang33Mode === 'eoi' && s.idiomas[1].fromBilingual, 'No activa y completa 3.3');
                near(api.Calculators.calc33(s), 4);
                assert(app.document.querySelector('[data-bilingual-autofill]'), 'Autocompleta sin avisar');
                assert(app.document.querySelector('#bilingual-certificate'), 'La deteccion de su propia fila oculta los controles');
                api.setBilingualAnswer('certificate', 'eoi-C1');
                s = api.getState();
                assert(s.idiomas.length === 2 && s.idiomas[1].nivel === 'C1', 'Duplica la fila automatica al corregir nivel');
                near(api.Calculators.calc33(s), 5);
                api.updateIdioma(1, 'nivel', 'B1');
                assert(!s.idiomas[1].fromBilingual, 'No conserva como manual una fila corregida');
                assert(api.getBilingualResult(s).status === 'pending', 'No sincroniza la correccion manual a B1');
                api.setBilingualAnswer('certificate', 'eoi-C2');
                assert(api.getState().idiomas.includes(manual) && api.getState().idiomas.some(item => item.nivel === 'B1'), 'Sobrescribe datos corregidos manualmente');
                assert(api.getState().idiomas.filter(item => item.fromBilingual).length === 1, 'Crea varias filas automaticas');
                app.removeIdioma(api.getState().idiomas.findIndex(item => item.fromBilingual));
                assert(api.getBilingualResult(api.getState()).status === 'pending', 'Mantiene una acreditacion automatica borrada');
            });
            await test('Bilingues: ACLES solo se autocompleta por coincidencia exacta y tras confirmar', () => {
                api.setState(fresh({ bilingual: { enabled: true, specialty: '590001', language: 'Inglés' } }));
                app.switchTab(3);
                api.addIdiomaForOrigin('ACLES');
                api.setBilingualAnswer('certificate', 'fce');
                assert(api.getState().idiomas.length === 1, 'No reutiliza una fila vacia');
                assert(api.getState().idiomas[0].certificado === 'Cambridge First Certificate in English (FCE)', 'Certificado 5.5 incorrecto');
                assert(api.getState().lang55Mode === 'other', 'No activa 5.5');
                near(api.Calculators.calc55(api.getState()), 2);
                api.setBilingualAnswer('certificateLevel', 'C1');
                near(api.Calculators.calc55(api.getState()), 0);
                api.setBilingualAnswer('certificate', 'cae');
                near(api.Calculators.calc55(api.getState()), 3);
                api.setBilingualAnswer('certificate', 'aptis-esol-c1');
                api.setBilingualAnswer('conditionsConfirmed', true);
                assert(api.getBilingualResult(api.getState()).status === 'yes', 'Aptis pierde la validez bilingue');
                near(api.Calculators.calc55(api.getState()), 0);
                api.setBilingualAnswer('certificate', 'languagecert-communicator');
                near(api.Calculators.calc55(api.getState()), 0);
                api.setBilingualAnswer('conditionsConfirmed', true);
                near(api.Calculators.calc55(api.getState()), 2);
                api.setBilingualAnswer('certificate', 'toefl-c1');
                api.setBilingualAnswer('conditionsConfirmed', true);
                near(api.Calculators.calc55(api.getState()), 0);
                assert(!api.getState().idiomas.length, 'Inventa un tramo ACLES para una equivalencia ambigua');
                api.setBilingualAnswer('certificate', 'degree');
                api.setBilingualAnswer('conditionsConfirmed', true);
                near(api.Calculators.total(api.getState()), 0);
            });
            await test('Bilingues: certificados con condiciones se preseleccionan sin duplicar puntos', () => {
                const manual = { idioma: 'Inglés', origen: 'ACLES', nivel: 'B2', nivelFiltro: 'B2', certificado: 'Trinity ISE II (B2)' };
                api.setState(fresh({ idiomas: [manual] }));
                app.switchTab(5);
                api.setBilingualAnswer('enabled', true);
                api.setBilingualAnswer('specialty', '590001');
                assert(api.getState().bilingual.certificate === 'ise-II', 'No preselecciona el certificado condicionado');
                assert(app.document.querySelector('#bilingual-certificate').value === 'ise-II', 'No muestra la preseleccion');
                assert(api.getBilingualResult(api.getState()).status === 'pending', 'Omite las condiciones de Trinity');
                api.setBilingualAnswer('conditionsConfirmed', true);
                assert(api.getBilingualResult(api.getState()).status === 'yes', 'No reconoce las condiciones confirmadas');
                assert(api.getState().idiomas.length === 1 && api.getState().idiomas[0] === manual, 'Duplica o cambia un merito manual');
                api.setBilingualAnswer('certificate', 'ise-II');
                assert(api.getState().idiomas.length === 1 && !manual.fromBilingual, 'Convierte un merito manual en automatico');
                api.setBilingualAnswer('conditionsConfirmed', true);
                near(api.Calculators.calc55(api.getState()), 2);
            });
            await test('Bilingues: aviso rojo distingue acreditacion bilingue de merito ACLES', () => {
                api.setState(fresh({ bilingual: { enabled: true, specialty: '590001', language: 'Inglés' } }));
                app.switchTab(3);
                api.setBilingualAnswer('certificate', 'aptis-esol-b2');
                let warning = app.document.querySelector('[data-bilingual-merit-warning]');
                assert(warning && warning.classList.contains('border-red-500') && warning.getAttribute('role') === 'alert', 'No muestra aviso rojo al seleccionar Aptis');
                assert(warning.textContent.includes('no puntúa') && warning.textContent.includes('5.5'), 'No explica el alcance de la exclusion');
                const link = warning.querySelector('a');
                assert(link.textContent.includes('28/07/2025') && link.href.includes('Tablas_de_certificados_reconocidos_por_ACLES.pdf'), 'Fecha o tabla incorrecta');
                assert(link.target === '_blank' && link.rel.includes('noopener') && link.querySelector('svg[aria-hidden="true"]'), 'Enlace sin proteccion o flecha');
                api.setBilingualAnswer('conditionsConfirmed', true);
                assert(api.getBilingualResult(api.getState()).status === 'yes' && app.document.querySelector('[data-bilingual-merit-warning]'), 'Confunde acceso bilingue con puntuacion');
                near(api.Calculators.total(api.getState()), 0);
                app.switchTab(5);
                assert(app.document.querySelector('[data-bilingual-merit-warning]'), '5.5 no comparte el aviso');
                for (const certificate of ['eoi-B2', 'fce', 'toefl-c1', 'pearson-b2']) {
                    api.setBilingualAnswer('certificate', certificate);
                    assert(!app.document.querySelector('[data-bilingual-merit-warning]'), `Declara no reconocido un certificado reconocido: ${certificate}`);
                }
                api.setBilingualAnswer('certificate', 'gese-8');
                assert(app.document.querySelector('[data-bilingual-merit-warning]').textContent.includes('no puntúa'), 'No avisa sobre GESE');
                api.setBilingualAnswer('certificate', 'degree');
                warning = app.document.querySelector('[data-bilingual-merit-warning]');
                assert(warning.textContent.includes('mérito académico') && !warning.textContent.includes('no puntúa como mérito de idiomas'), 'Excluye indebidamente otros meritos de una titulacion universitaria');
                api.setBilingualAnswer('certificate', 'anglia-b2');
                assert(app.document.querySelector('[data-bilingual-merit-warning]').textContent.includes('denominación exacta'), 'Trata una equivalencia pendiente como no reconocida');
                api.setBilingualAnswer('language', 'Francés');
                api.setBilingualAnswer('certificate', 'ds');
                assert(!app.document.querySelector('[data-bilingual-merit-warning]'), 'Confunde diferencia de nivel con ausencia en ACLES');
            });
            await test('Bilingues: estado guardado y borrado sin modificar defaults', () => {
                const key = app.eval('STORAGE_KEY');
                const previous = app.localStorage.getItem(key);
                try {
                    api.setState(fresh());
                    app.localStorage.setItem(key, JSON.stringify({ bilingual: { enabled: true, specialty: '597031', language: 'Francés', certificate: 'delf' } }));
                    api.loadState();
                    assert(api.getBilingualResult(api.getState()).status === 'yes', 'No recupera el resultado guardado');
                    app.switchTab(3);
                    assert(app.document.querySelector('#bilingual-level').value === 'B2', 'No recupera el nivel de un certificado guardado anteriormente');
                    assert(api.getState().bilingual.conditionsConfirmed === false, 'No migra defaults');
                    app.confirmResetAll();
                    assert(!api.getState().bilingual.enabled && !api.INITIAL_STATE.bilingual.enabled, 'El borrado conserva respuestas');
                    api.setBilingualAnswer('enabled', true);
                    assert(!api.INITIAL_STATE.bilingual.enabled, 'Las respuestas mutan el estado inicial');
                    app.confirmResetAll();
                } finally {
                    if (previous === null) app.localStorage.removeItem(key);
                    else app.localStorage.setItem(key, previous);
                }
            });
            await test('Bilingues: nivel intermedio filtra certificados y reinicia requisitos', () => {
                api.setState(fresh());
                app.switchTab(3);
                api.setBilingualAnswer('enabled', true);
                api.setBilingualAnswer('specialty', '590001');
                api.setBilingualAnswer('language', 'Inglés');
                assert(app.document.querySelector('#bilingual-level'), 'Falta el nivel intermedio');
                assert(!app.document.querySelector('#bilingual-certificate'), 'Muestra titulos antes de elegir nivel');
                for (const [language, level, included, excluded] of [
                    ['Inglés', 'B2', 'fce', 'cae'],
                    ['Inglés', 'C1', 'cae', 'cpe'],
                    ['Inglés', 'C2', 'cpe', 'fce'],
                    ['Francés', 'B2', 'delf', 'dalf-c1'],
                    ['Francés', 'C1', 'dalf-c1', 'dalf-c2'],
                    ['Alemán', 'C1', 'goethe-c1', 'goethe-b2']
                ]) {
                    api.setBilingualAnswer('language', language);
                    api.setBilingualAnswer('certificateLevel', level);
                    const select = app.document.querySelector('#bilingual-certificate');
                    assert(select.querySelector(`option[value="${included}"]`), `Falta certificado de ${language}/${level}`);
                    assert(!select.querySelector(`option[value="${excluded}"]`), `Ofrece otro nivel en ${language}/${level}`);

            });
            await test('Enter avanza desde la casilla del paso de antiguedad y al perder el foco', () => {
                api.setState(fresh());
                app.openSeniorityWizard();
                app.document.getElementById('wizard-status').value = 'definitive';
                app.setWizardDateValue('wizard-practice-start', '2023-09-01');
                const dialog = app.document.getElementById('seniority-wizard');
                const index = app.getSeniorityWizardSteps().findIndex(step => step.querySelector('#wizard-no-interino'));
                const checkbox = app.document.getElementById('wizard-no-interino');
                const date = app.document.getElementById('wizard-body-start-text');
                for (const useCheckboxFocus of [true, false]) {
                    dialog.dataset.stepIndex = String(index);
                    api.renderSeniorityWizardStep();
                    checkbox.checked = false;
                    app.toggleNoInterino();
                    date.focus();
                    checkbox.checked = true;
                    checkbox.dispatchEvent(new app.Event('change', { bubbles: true }));
                    assert(date.disabled, 'No bloquea la fecha automatica');
                    if (useCheckboxFocus) checkbox.focus();
                    else app.document.activeElement.blur();
                    const event = new app.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
                    app.document.activeElement.dispatchEvent(event);
                    assert(event.defaultPrevented, 'No recibe Enter tras marcar No fui interino/a');
                    assert(Number(dialog.dataset.stepIndex) === index + 1, 'Enter no avanza al paso siguiente');
                    assert(checkbox.checked, 'Enter modifica la respuesta de la casilla');
                }
                dialog.dataset.stepIndex = String(index);
                api.renderSeniorityWizardStep();
                checkbox.focus();
                const space = new app.KeyboardEvent('keydown', { key: ' ', bubbles: true, cancelable: true });
                checkbox.dispatchEvent(space);
                assert(!space.defaultPrevented && Number(dialog.dataset.stepIndex) === index, 'Intercepta Espacio para avanzar');
                app.closeSeniorityWizard();
                const enter = new app.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
                app.document.body.dispatchEvent(enter);
                assert(!enter.defaultPrevented && Number(dialog.dataset.stepIndex) === index, 'Activa el atajo fuera del cuestionario');
            });
            await test('Enter no interfiere con controles nativos, modificadores, composicion ni repeticion', () => {
                api.setState(fresh());
                app.openSeniorityWizard();
                const dialog = app.document.getElementById('seniority-wizard');
                const select = app.document.getElementById('wizard-status');
                select.value = 'provisional';
                for (const target of [
                    select, app.document.getElementById('wizard-next'),
                    app.document.getElementById('wizard-back')
                ]) {
                    const event = new app.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
                    target.dispatchEvent(event);
                    assert(!event.defaultPrevented, 'Intercepta el teclado de un control nativo');
                    assert(dialog.dataset.stepIndex === '0', 'El atajo avanza desde un control nativo');
                }
                const heading = dialog.querySelector('[data-wizard-step] h3');
                for (const options of [
                    { key: 'Escape' }, { key: 'Enter', repeat: true }, { key: 'Enter', isComposing: true },
                    { key: 'Enter', ctrlKey: true }, { key: 'Enter', altKey: true },
                    { key: 'Enter', metaKey: true }, { key: 'Enter', shiftKey: true }
                ]) {
                    const event = new app.KeyboardEvent('keydown', { bubbles: true, cancelable: true, ...options });
                    heading.dispatchEvent(event);
                    assert(!event.defaultPrevented && dialog.dataset.stepIndex === '0', 'Activa el atajo con otra tecla o modificador');
                }
                const handled = new app.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
                handled.preventDefault();
                heading.dispatchEvent(handled);
                assert(dialog.dataset.stepIndex === '0', 'Procesa un evento ya atendido');
                app.closeSeniorityWizard();
                heading.dispatchEvent(new app.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
                assert(dialog.dataset.stepIndex === '0', 'Avanza con el cuestionario cerrado');
            });
            await test('Aviso de exceso y puntuacion se actualizan sin borrar la entrada', () => {
                api.setState(fresh({ s1_2_1_years: 2 }));
                app.switchTab(6);
                const input = app.document.querySelector('[name="s6_5_tribunales"]');
                const notice = app.document.querySelector('[data-service-count="s6_5_tribunales"]');
                assert(notice.classList.contains('hidden'), 'Aviso visible sin exceso');
                input.value = '5';
                api.handleInput(input);
                assert(api.getState().s6_5_tribunales === 5, 'Entrada borrada');
                assert(notice.classList.contains('text-red-600'), 'No muestra aviso rojo');
                assert(!notice.classList.contains('hidden'), 'Aviso oculto con exceso');
                near(api.Calculators.calc65(api.getState()), 1);
                input.value = '2';
                api.handleInput(input);
                assert(notice.classList.contains('hidden'), 'Aviso visible al corregir el exceso');
            });
            await test('Resumen e impresion muestran disclaimer y cantidades efectivamente computadas', () => {
                api.setState(fresh({ s1_2_1_years: 2, s4_1_director_years: 9, s6_6_tutor_aspirantes: 9 }));
                const summary = parsed(api.renderSummary());
                assert(summary.querySelector('.simulation-notice'), 'Falta aviso de simulacion');
                assert(!summary.querySelector('.simulation-notice').classList.contains('no-print'), 'Aviso oculto al imprimir');
                assert(api.renderServiceLimitSummary().includes('4.1 Dirección'), 'Falta explicacion del limite');
                assert(parsed(api.renderBreakdown()).textContent.includes('Dirección (2 años y 0 meses)'), 'Desglose incluye exceso');
                assert(api.renderBreakdown().includes('funcionario/a en prácticas'), 'Terminologia no uniforme');
            });
            await test('La caja de ayuda intercepta los toques sobre botones situados debajo', async () => {
                api.setState(fresh({ s4_3_tutoria_antes_2007: 'no' }));
                frame.style.width = '375px';
                app.closeLanding();
                app.switchTab(4);
                const trigger = app.document.querySelector('[aria-describedby="tutoring-start-info"]');
                trigger.focus();
                await new Promise(resolve => setTimeout(resolve, 350));
                const tooltip = app.document.getElementById('tutoring-start-info');
                const bounds = tooltip.getBoundingClientRect();
                const button = app.document.createElement('button');
                let clicked = false;
                button.onclick = () => { clicked = true; };
                button.style.cssText = `position:fixed;left:${bounds.left}px;top:${bounds.top}px;width:${bounds.width}px;height:${bounds.height}px`;
                app.document.getElementById('main-content').append(button);
                try {
                    const target = app.document.elementFromPoint(bounds.left + bounds.width / 2, bounds.top + bounds.height / 2);
                    assert(target === tooltip || tooltip.contains(target), `El toque atraviesa la ayuda: ${target?.outerHTML.slice(0, 180)}, ${app.getComputedStyle(tooltip).visibility}, ${app.getComputedStyle(tooltip).pointerEvents}`);
                    target.click();
                    assert(!clicked, 'Se activa el boton inferior');
                } finally {
                    button.remove();
                    trigger.blur();
                }
            });
            await test('Primera y ultima pestana quedan fuera de las flechas en movil', () => {
                frame.style.width = '375px';
                for (const tab of [1, 7]) {
                    app.switchTab(tab);
                    const active = app.document.getElementById(`tab-${tab}`).getBoundingClientRect();
                    const left = app.document.getElementById('tabs-scroll-left').getBoundingClientRect();
                    const right = app.document.getElementById('tabs-scroll-right').getBoundingClientRect();
                    assert(active.left >= left.right - 1, 'La flecha izquierda tapa la pestana');
                    assert(active.right <= right.left + 1, 'La flecha derecha tapa la pestana');
                }
            });
            await test('Sin desbordamiento en todas las pestanas, modos y cambios de ancho', async () => {
                api.setState(fresh({
                    s1_2_1_years: 40, s1_1_1_years: 40, s3_1_1_doctor: 99,
                    lang33Mode: 'eoi', lang55Mode: 'other', s5_4_competencia_digital: 'C2',
                    idiomas: [
                        { idioma: 'Inglés', nivel: 'C2', origen: 'EOI' },
                        { idioma: 'Francés', nivel: '', origen: 'ACLES' }
                    ]
                }));
                app.closeLanding();
                for (const width of [320, 360, 375, 390, 430, 640, 768, 1024, 320]) {
                    frame.style.width = `${width}px`;
                    for (const dark of [false, true]) {
                      app.document.documentElement.classList.toggle('dark', dark);
                      for (let tab = 1; tab <= 7; tab++) {
                        app.switchTab(tab);
                        await new Promise(resolve => setTimeout(resolve, 50));
                        const root = app.document.documentElement;
                        assert(root.scrollWidth <= root.clientWidth, `${width}px, pestana ${tab}, oscuro=${dark}: ${root.scrollWidth}px > ${root.clientWidth}px`);
                      }
                    }
                }
            });
            window.testResults = results;
            document.body.dataset.testStatus = results.every(r => r.passed) ? 'passed' : 'failed';
            document.getElementById('results').textContent = results.map(r => `${r.passed ? 'PASS' : 'FAIL'} ${r.name}${r.error ? ': ' + r.error : ''}`).join('\n');
        };
        frame.src = '../index.html?calculator-tests';
    </script>
